name: Deploy Zone Distribution Dashboard

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Download latest Zone Distribution workbook from Google Drive
        run: |
          mkdir -p data
          pip install gdown
          gdown --folder 16HTr8nfPz4P2PMr4QB0bjgwiD110Qd-0 -O temp_drive
          find temp_drive -name "*.xlsx" -type f | head -1 | xargs -I {} cp "{}" data/Zone_Distribution.xlsx
          echo "Workbook downloaded:"
          ls -lh data

      - name: Build dashboard from schema-matched Excel workbook
        run: python scripts/build.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
